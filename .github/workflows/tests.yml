name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.solver }} solver
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        solver: [classic, libmamba, rattler]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.72.2
          cache: true
          activate-environment: true

      - name: Run tests for ${{ matrix.solver }}
        run: pixi run -e default test-$MATRIX_SOLVER-solver -vv
        shell: bash
        env:
          MATRIX_SOLVER: ${{ matrix.solver }}
          FORCE_COLOR: '1'

  upstream-test:
    name: Upstream conda tests (side-by-side, ${{ matrix.conda-test-solvers }})
    runs-on: ubuntu-latest
    env:
      # Keep in sync with the provenance commit of the YAML tests
      CONDA_UPSTREAM_COMMIT: 89b1f307476a8309dd8999a19daf8a4cef260f94
    strategy:
      fail-fast: false
      matrix:
        conda-test-solvers: [libmamba, classic, rattler]
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout conda/conda at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conda/conda
          ref: ${{ env.CONDA_UPSTREAM_COMMIT }}
          path: conda-src
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.72.2
          cache: true
          environments: conda-upstream

      - name: Install conda editable from the pinned checkout
        # deps come from the pixi environment; --no-deps keeps the pinned
        # conda source as the only conda in the env (and gives us tests/ + tests/data)
        run: pixi run -e conda-upstream pip install -e ./conda-src --no-deps

      - name: Run ported tests against upstream conda
        shell: bash
        env:
          FORCE_COLOR: '1'
          CONDA_TEST_SOLVERS: ${{ matrix.conda-test-solvers }}
        run: |
          pixi run -e conda-upstream python tools/collect_ported_node_ids.py > ported_node_ids.txt

          echo "Running the following upstream node IDs with the $CONDA_TEST_SOLVERS solver:"
          cat ported_node_ids.txt

          cd conda-src

          pixi run -e conda-upstream \
          --manifest-path "$GITHUB_WORKSPACE/pyproject.toml" \
          pytest $(cat ../ported_node_ids.txt) -vv

  test-python-minimum:
    name: Test on minimum supported Python (currently 3.11) / ${{ matrix.solver }} solver
    strategy:
      fail-fast: false
      matrix:
        solver: [classic, libmamba, rattler]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.72.2
          cache: true
          environments: test-python-minimum

      - name: Run tests on minimum supported Python
        shell: bash
        env:
          MATRIX_SOLVER: ${{ matrix.solver }}
        run: pixi run -e test-python-minimum test-$MATRIX_SOLVER-solver -vv

  analyze:
    name: Aggregate
    needs: [test, upstream-test, test-python-minimum]
    if: '!cancelled()'
    runs-on: ubuntu-slim
    steps:
      - name: Determine Success
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
