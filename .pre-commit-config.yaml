# disable autofixing PRs, commenting "pre-commit.ci autofix" on a pull request triggers a autofix
ci:
  autofix_prs: false
  # check-cst-schema needs the project's conda/msgspec/typer environment,
  # which pre-commit.ci's isolated hook envs don't provide. It still runs
  # locally and in the docs workflow.
  skip: [check-cst-schema]
repos:
  # generic verification and formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # standard end of line/end of file cleanup
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # ensure syntaxes are valid
      - id: check-toml
      - id: check-yaml
      # catch git merge/rebase problems
      - id: check-merge-conflict
  # Python verification and formatting
  - repo: https://github.com/adamchainz/blacken-docs
    rev: dda8db18cfc68df532abf33b185ecd12d5b7b326 # frozen: 1.20.0
    hooks:
      # auto format Python codes within docstrings
      - id: blacken-docs
  - repo: https://github.com/conda-incubator/pre-commit-mirrors-ruff
    rev: ef8da846457ee2fcd3fa77979db3787e1279bfe3 # frozen: 0.17.1
    hooks:
      # lint & attempt to correct failures (e.g. pyupgrade)
      - id: ruff-conda
      # compatible replacement for black
      - id: ruff-format-conda
  - repo: https://github.com/conda-incubator/pre-commit-mirrors-prettier
    rev: 24c47c999b0f35f38084bf4967a1f697f834bf16 # frozen: 3.9.6
    hooks:
      - id: prettier-conda
        types_or: [yaml]
        args:
          - --write
          - --list-different
          - --ignore-unknown
          - --single-quote
          - --end-of-line
          - auto
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f # frozen: v2.16.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --trailing-commas, --no-sort]
  - repo: meta
    # see https://pre-commit.com/#meta-hooks
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  # project-specific checks that need the pixi-managed dev environment
  - repo: local
    hooks:
      - id: check-cst-schema
        name: check docs/cst_schema.json is up to date
        description: >-
          Regenerates the JSON schema for TestModule and fails if
          docs/cst_schema.json is stale relative to models.py. Run `pixi run
          generate-schema` to update the file, then commit the change.
        # Invoked via `pixi run` (rather than calling python directly) so the
        # check resolves the project's pixi environment on its own, even if
        # the shell running `git commit` doesn't have it activated.
        entry: pixi run check-schema
        language: system
        files: ^(pytest_conda_solvers/models\.py|tools/cli\.py|docs/cst_schema\.json)$
        pass_filenames: false
